      return `<svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="5" fill="${langColor}"/><text x="12" y="17" text-anchor="middle" fill="white" font-size="9" font-weight="bold" font-family="monospace">$</text></svg>`;
    } else {
      return `<svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect width="24" height="24" rx="5" fill="${langColor}"/><text x="12" y="17" text-anchor="middle" fill="white" font-size="10" font-weight="bold" font-family="monospace">&lt;/&gt;</text></svg>`;
    }
  }

  function renderCards() {
    const query = searchInput.value.trim().toLowerCase();
    let filtered = listcodeData.filter(s => s.name.toLowerCase().includes(query));
    codeCountSpan.innerText = `${filtered.length} Codes`;
    
    if (filtered.length === 0) {
      cardsContainer.innerHTML = `<div class="col-span-full text-center py-16"><span class="material-icons text-5xl opacity-40">search_off</span><h3 class="text-xl font-bold mt-2">No results found</h3></div>`;
      return;
    }
    
    cardsContainer.innerHTML = filtered.map(s => {
      let badgeHtml = '';
      if (s.badge === 'no_fee') {
        badgeHtml = `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-600 text-white">NO FEE</span>`;
      }
      
      const extensionRaw = s.extension || '.' + s.name.split('.').pop();
      const cleanExt = extensionRaw.replace('.', '');
      const langMeta = getLanguageMetadata(cleanExt);
      const languageDisplayName = langMeta.name;
      const iconicColorClass = langMeta.bgClass;
      const iconicTextColor = langMeta.textClass;
      const langColor = langMeta.color;
      
      const logoSvg = getLogoComponent(langColor, cleanExt);
      
      return `
      <div class="bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 p-5 cursor-pointer transition-all hover:-translate-y-1 hover:shadow-xl card-glow light-card dark-card" onclick="redirectToCode('${s._id}')">
        <div class="flex justify-between items-start mb-3">
          <div class="w-12 h-12 rounded-xl flex items-center justify-center" style="background-color: ${langColor}15; border: 1px solid ${langColor}30;">
            ${logoSvg}
          </div>
          <div class="flex flex-col gap-1 items-end">
            ${badgeHtml}
            <span class="text-[9px] font-mono px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300">${cleanExt || s.name.split('.').pop()}</span>
          </div>
        </div>
        <h3 class="text-lg font-bold text-gray-900 dark:text-white mb-1 truncate">${escapeHtml(s.name)}</h3>
        <div class="mt-3 pt-3 border-t border-gray-200 dark:border-gray-700 flex items-center gap-2">
          <div class="w-2.5 h-2.5 rounded-full ${iconicColorClass}" style="background-color: ${langColor}; box-shadow: 0 0 0 1px rgba(0,0,0,0.1);"></div>
          <span class="text-[11px] font-bold uppercase tracking-wide ${iconicTextColor}" style="color: ${langColor};">${languageDisplayName}</span>
        </div>
      </div>
    `}).join('');
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }

  function handleSearch() {
    const val = searchInput.value;
    if (clearBtn) clearBtn.classList.toggle('hidden', val.length === 0);
    renderCards();
  }
  function clearSearch() { searchInput.value = ''; handleSearch(); }

  searchInput.addEventListener('input', handleSearch);
  clearBtn?.addEventListener('click', clearSearch);

  window.redirectToCode = function(filename) {
    window.location.href = `/codes/${filename}`;
  };

  function checkUrlAndRedirect() {
    const pathname = window.location.pathname;
    const match = pathname.match(/^\/codes\/(.+)$/);
    
    if (match && match[1] && listcodeData.length) {
      const filename = match[1];
      const found = listcodeData.find(s => s._id === filename);
      if (found) {
        window.location.href = `/codes/${filename}`;
      }
    }
  }

  function initTheme() {
    const isDark = localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    const html = document.documentElement;
    const body = document.body;
    if (isDark) {
      html.classList.add('dark');
      body.classList.add('dark-body', 'dark-mode');
      body.classList.remove('light-body', 'light-mode');
      document.getElementById('theme-toggle-dark-icon')?.classList.remove('hidden');
      document.getElementById('theme-toggle-light-icon')?.classList.add('hidden');
      body.classList.add('dark-scrollbar');
      body.classList.remove('light-scrollbar');
      loadHighlightStyle(true);
    } else {
      html.classList.remove('dark');
      body.classList.add('light-body', 'light-mode');
      body.classList.remove('dark-body', 'dark-mode');
      document.getElementById('theme-toggle-dark-icon')?.classList.add('hidden');
      document.getElementById('theme-toggle-light-icon')?.classList.remove('hidden');
      body.classList.add('light-scrollbar');
      body.classList.remove('dark-scrollbar');
      loadHighlightStyle(false);
    }
  }

  function toggleTheme() {
    const isDark = document.documentElement.classList.contains('dark');
    const newIsDark = !isDark;
    const html = document.documentElement;
    const body = document.body;
    if (newIsDark) {
      html.classList.add('dark');
      body.classList.add('dark-body', 'dark-mode');
      body.classList.remove('light-body', 'light-mode');
      document.getElementById('theme-toggle-dark-icon')?.classList.remove('hidden');
      document.getElementById('theme-toggle-light-icon')?.classList.add('hidden');
      body.classList.add('dark-scrollbar');
      body.classList.remove('light-scrollbar');
      loadHighlightStyle(true);
      localStorage.setItem('theme', 'dark');
    } else {
      html.classList.remove('dark');
      body.classList.add('light-body', 'light-mode');
      body.classList.remove('dark-body', 'dark-mode');
      document.getElementById('theme-toggle-dark-icon')?.classList.add('hidden');
      document.getElementById('theme-toggle-light-icon')?.classList.remove('hidden');
      body.classList.add('light-scrollbar');
      body.classList.remove('dark-scrollbar');
      loadHighlightStyle(false);
      localStorage.setItem('theme', 'light');
    }
    forceHighlightCode();
  }

  document.getElementById('theme-toggle')?.addEventListener('click', toggleTheme);
  initTheme();
  fetchData();
</script>
</body>
</html>
